# AWS Bedrock Luma Ray v2 — text-to-video on Luma Ray v2 in us-west-2.
#
# Uses the generic BedrockVideoEngine: engine takes a model_input_template
# dict where "${PROMPT}" is recursively substituted at submit time.  Swap
# the model_id + model_input_template block to point at Nova Reel, Luma
# Ray v2, or any future Bedrock async-video model — no code change needed.
#
# Setup (one-time):
#   1. Render and attach the scoped policy. The tracked file is a TEMPLATE
#      (`<AWS_ACCOUNT>`, `<S3_OUTPUT_BUCKET>`) and cannot be attached as-is:
#        pixi run python tools/render_aws_policy.py --policy bedrock-luma-ray \
#          --output-bucket "$KINOFORGE_LIVE_S3_BUCKET" \
#          --out /tmp/bedrock-luma-ray.rendered.json
#      then attach /tmp/bedrock-luma-ray.rendered.json to the kinoforge-ci IAM user
#      (see .aws/README.md, "Bedrock policies").
#   2. AWS Model access page is retired — serverless foundation models
#      auto-activate on first invoke. No console step needed.
#
# Live smoke: `KINOFORGE_LIVE_TESTS=1 pixi run pytest tests/live/test_luma_ray_live.py -v`
#
# The prompt body is loaded at smoke-test runtime from
# /workspace/examples/configs/prompts/field-realistic.txt per the project's standard-prompt
# directive (see PROGRESS.md "Standard prompt for all video-generation live
# smokes").

engine:
  kind: bedrock_video
  precision: fp16
  bedrock_video:
    region_name: us-west-2
    model_id: luma.ray-v2:0
    output_s3_uri: s3://<S3_BUCKET>/kinoforge-output/
    # Pricing: $0.75/sec @ 540p 24fps, $1.50/sec @ 720p 24fps (Bedrock catalog).
    # 540p chosen for smoke iteration cost; bump to 720p for production-quality
    # comparison runs.
    model_input_template:
      prompt: "${PROMPT}"
      duration: 5
      aspect_ratio: "16:9"
      loop: false
      resolution: "540p"

models:
  - kind: base
    ref: bedrock://luma.ray-v2:0
    target: checkpoints

lifecycle:
  budget: 5.0

spec:
  prompt: ""  # filled at runtime from /workspace/examples/configs/prompts/field-realistic.txt

params: {}
