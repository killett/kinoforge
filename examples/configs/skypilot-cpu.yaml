# kinoforge example: SkyPilot (CPU lifecycle smoke) — Phase 31
#
# Demonstrates the bare SkyPilotProvider configuration used by the
# Phase 31 real-cloud verification smoke (spec §3.3, plan T3):
#   - Smallest CPU SKU on GCP us-central1 (SkyPilot picks SKU from
#     cpus/memory requirements; no GPU)
#   - idle_timeout 60 s -> SkyPilot autostop=1 (minute), which is INERT for
#     this server-mode deploy: run_cmd becomes a never-terminating
#     Task.run, so is_cluster_idle() is permanently False. Real cleanup is
#     orchestrator try/finally, preflight guard, gcloud nuclear fallback,
#     and the instance-side deadline watchdog at max_lifetime below.
#   - Engine-on-SkyPilot smoke is deferred (spec §7); the engine
#     block below is a comfyui placeholder for schema completeness
#
# Cost envelope: <= $0.05 per smoke run, layer ceiling $0.50.

engine:
  kind: comfyui
  precision: fp16
  comfyui:
    version: "0.3.10"

models:
  - ref: "hf:Wan-AI/Wan2.2-T2V-A14B:high_noise_model/diffusion_pytorch_model-00001-of-00006.safetensors"
    kind: base
    target: checkpoints

compute:
  # SkyPilot picks the concrete SKU from cpus/memory requirements at
  # launch time; the live smoke uses the smallest CPU class GCP
  # offers (~e2-micro / n1-standard-1, ~$0.01/hr).  Region pinning
  # (us-central1) is enforced by the smoke test itself, not by this
  # YAML — ComputeConfig has no region field today.
  provider: skypilot
  # Public Ubuntu base. The original `skypilot/skypilot:latest` placeholder
  # the Phase-31 template shipped with does NOT exist on Docker Hub —
  # `docker pull` 404s and sky surfaces it as "Failed to set up SkyPilot
  # runtime on cluster" (Stage-E live smoke 2026-06-18). Pinning a real
  # public image keeps the cfg deploy-able as-is. Swap for a workload
  # image when running real generations.
  image: "ubuntu:22.04"
  mode: pod
  placement:
    min_vram_gb: 0
    # Inert on this config, kept for honesty: min_vram_gb == 0 makes
    # SkyPilotProvider.find_offers short-circuit to the synthetic
    # `sky-cpu-auto` offer before filter_offers ever compares a CUDA version.
    # "0" states the intent — a CPU box needs no CUDA — for the day this cfg
    # grows a GPU or another provider stops short-circuiting.
    min_cuda: "0"
    max_usd_per_hr: 0.50
    disk_gb: 50
  lifecycle:
    # Maps to SkyPilot autostop (idle_timeout seconds -> autostop minutes via
    # InterfaceLifecycle.idle_timeout_s in SkyPilotProvider.create_instance),
    # but autostop cannot fire for a server-mode deploy (see the header).
    # Kept for provider portability; on skypilot the protection comes from
    # max_lifetime below.
    idle_timeout: 60
    # Not enforced on skypilot — only RunPod passes this through
    # (executionTimeoutMs). Used here for budget estimation only.
    job_timeout: 25m
    time_buffer: 5m
    # THE guardrail on this provider: the instance-side deadline watchdog
    # (providers/skypilot/watchdog.py) arms at the top of Task.setup and
    # autodowns the cluster at launch + max_lifetime, surviving controller death.
    max_lifetime: 30m
    boot_timeout: 10m
    max_in_flight: 1
    # Per-run ceiling; the layer-wide $0.50 envelope is enforced
    # externally by the smoke harness.
    budget: 0.50
    # Required when warm_reuse_auto_attach=true (HeartbeatIntervalRequiredCheck),
    # and genuinely required. Note what it does NOT do: skypilot has no
    # wire-level heartbeat read, so last_heartbeat is the orchestrator clock —
    # it proves the controller is alive, not that the cluster is.
    heartbeat_interval_s: 20

# Engine-on-SkyPilot smoke is deferred (spec §7) — these blocks are
# kept minimal so the example parses end-to-end without claiming a
# runnable ComfyUI graph on a CPU SKU.
spec:
  graph:
    nodes: []
  node_overrides: {}

params: {}

# --- Optional: GCS artifact store (Phase 13 / Layer C) ----------------------
# Uncomment and fill in `bucket:` to publish artifacts to GCS.  Authenticate
# via the standard GCP path: set GOOGLE_APPLICATION_CREDENTIALS to a service
# account JSON file (see `.env.example`).  YAML interpolation of ${VAR} is
# not supported by the kinoforge loader; uncomment and edit `bucket:` directly.
#
# store:
#   kind: gcs
#   bucket: my-org-kinoforge
#   prefix: prod/runs

# Layer O — user-facing output directory.  Uncomment to override defaults.
# output:
#   kind: local
#   dir: output
#   enabled: true
