# Wan 2.1 T2V-1.3B + LoRA-flexible warm-reuse smoke cfg (Tier 3)
#
# Smaller-sibling counterpart to runpod-diffusers-wan-2_2-14b-t2v-lora-flexible-warm-reuse-release.yaml.
# Runs on demand via `gh workflow run smoke-wan21-weekly.yml` (dispatch-only
# since 2026-09-21) on a RunPod A5000 24GB pod. Validates the real-diffusers
# LoRA-swap matrix (single-LoRA per Wan 2.1's single-transformer architecture)
# at ~$0.20/fire.
#
# Operator must populate `smoke.lora_a` + `smoke.lora_b` with two
# Wan 2.1 1.3B-compatible single LoRA refs before dispatching the
# workflow. Per user-scope `fetch-lora-metadata-not-just-ids` memory,
# include trigger word + recommended strength in the README comment.

engine:
  kind: diffusers
  precision: fp16
  diffusers:
    image: "runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04"
    server_cmd: ["python", "-m", "kinoforge.engines.diffusers.servers.wan_t2v_server"]
    pip:
      - "torch==2.6.0"
      - "torchvision==0.21.0"
      - "torchaudio==2.6.0"
      - "diffusers>=0.32"
      - "transformers>=4.45"
      - "accelerate>=1.0"
      - "peft>=0.13"      # required by diffusers' LoRA loaders (set_adapters, unload_lora_weights)
      - "fastapi>=0.115"
      - "uvicorn>=0.30"
      - "imageio[ffmpeg]>=2.34"
    base_url: "http://localhost:8000"
    prompt_body_key: "prompt"
    # Needs-only embed (U53). A whole-package embed of
    # kinoforge.engines.diffusers.servers also shipped minimax_h3_server.py,
    # _lora.py and _av_io.py — ~39.4 KB of env payload for modules only the
    # Modal-only H3 server imports, which pushed 8 of 13 RunPod diffusers
    # configs past the ~101 KB create-mutation ceiling. Enforced by
    # tests/providers/test_pod_embed_closure.py; see
    # docs/superpowers/specs/2026-09-23-u53-needs-only-embed-design.md.
    embed_files:
      - "kinoforge.engines.diffusers.servers.wan_t2v_server"
      - "kinoforge.engines.diffusers.servers._util_stats"
      - "kinoforge.engines.diffusers.servers._video_io"

models:
  - ref: "hf:Wan-AI/Wan2.1-T2V-1.3B-Diffusers"
    kind: base
    target: checkpoints

compute:
  provider: runpod
  image: "runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04"
  mode: pod
  warm_reuse_auto_attach: true
  tags:
    smoke_tier: "kinoforge-smoke-tier-3"
  backend_options:
    runpod:
      # This cfg's max_lifetime is 60m and boot_timeout 30m — far past the
      # ~10 minute window after which RunPod reclaims community-pool pods
      # (U42; CLAUDE.md "RunPod community-pool deletions 2026-07-03"). The
      # 2026-09-21 scheduled run died exactly this way: ProvisionFailed,
      # "pod 'nn7goq4pu1fmnh' boot stalled", 19 minutes of billed nothing.
      cloud_type: secure
  placement:
    min_vram_gb: 24
    min_cuda: "12.4"
    # Raised 0.40 -> 0.60 on 2026-09-21, matching the operator decision of
    # 2026-09-12 (2c446eef) on the sibling 1.3B grid cfg and taken for the
    # identical reason: at 0.40 no current RunPod offer can satisfy this cfg,
    # so every scheduled run failed in ~47 s with RateCapExceeded. 2c446eef's
    # own message says verbatim "Not licence to raise other shipped caps" —
    # and its $0.49/hr measurement was taken on pods booked with NO
    # cloud_type pin, while this cfg now pins cloud_type: secure (above) in
    # the same change. SECURE-pool rates run materially above community/ALL,
    # so 0.60 is UNPROVEN against the pool this cfg actually books into. The
    # failure mode if it's still too low is a fast, cheap RateCapExceeded
    # (~47 s), and with the cron gone the first dispatch is a watched manual
    # run — treat it as a probe, not a validation.
    max_usd_per_hr: 0.60
    accelerators:
      - "NVIDIA RTX A5000"
      - "NVIDIA GeForce RTX 4090"
      - "NVIDIA L4"
    disk_gb: 40
  lifecycle:
    idle_timeout: 10m
    job_timeout: 5m
    time_buffer: 2m
    max_lifetime: 60m
    boot_timeout: 30m
    budget: 0.50
    heartbeat_interval_s: 30
    lora_swap_re_probe_after_s: 300

spec:
  model: "Wan2.1-T2V-1.3B-Diffusers"
  pipeline: "WanPipeline"
  scheduler: "UniPCMultistepScheduler"
  width: 480
  height: 480
  num_frames: 33
  fps: 16

# Official Wan 2.1 1.3B T2V test LoRA pair. Operator-specified
# (2026-06-21). Both ship on the "Wan Video 1.3B t2v" base so 1.3B
# compatibility is explicit, not inferred. Picked for cross-style
# mp4-sha distinctness across the 4-step swap matrix.
# Full metadata + activation guidance in README.md
# "Default test LoRAs (Wan 2.1 1.3B T2V)".
#
# - lora_a: wan2.1 1.3b static rotation (camera-rotation motion)
#     trigger: "sttcrttn", strength: 1.0
#     https://civitai.com/models/1479320?modelVersionId=1673265
# - lora_b: Pokemon Sprite Animation Video LoRA (Gen-5 sprite art)
#     no trigger word (activates by load); recommended 768x768
#     output; strength: 1.0
#     https://civitai.com/models/1595383?modelVersionId=1805395
smoke:
  lora_a: "civitai:1479320@1673265"
  lora_b: "civitai:1595383@1805395"
