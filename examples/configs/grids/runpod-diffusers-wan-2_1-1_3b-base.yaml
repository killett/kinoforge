# Wan 2.1 1.3B base cfg for grid examples (LoRA-bearing).
#
# - prompt: verbatim from examples/configs/prompts/field-realistic.txt
#   (standard video-gen smoke prompt per CLAUDE.md memory).
# - loras: official LoRA pair (Static Rotation + Pokemon Sprite),
#   strength=1.0 (overrideable per cell via dotted-path).
# - engine + compute + lifecycle: cloned from
#   runpod-diffusers-wan-2_1-1_3b-t2v-strength-grid.yaml (proven Tier-3 green path).

mode: t2v
prompt: "Photorealistic, cinematic 5-second shot on anamorphic lenses with shallow depth of field and subtle lens flare. A slow push-in toward a young woman in a sweeping alpine meadow of wildflowers; behind her, a tall waterfall tumbles down moss-covered cliffs into a misting pool. Warm golden-hour light rakes across the field, backlighting her glowing silhouette and igniting floating pollen and mist that drift like tiny embers of light. Her simple but vividly colored dress ripples in the breeze, strands of hair lifting. Facing away, she turns to glance over her shoulder with a coy, gentle smile as the camera glides into an intimate close-up on her eyes. Around her, friendly magical creatures move with slow grace — luminous butterflies and glowing wisps trailing ribbons of soft light. The sky is clear and radiant, brushed with wisps of cloud. Filmic color grade, warm highlights, soft shadows, fine film grain, volumetric god rays cutting through the mist. Serene, ethereal, breathtaking."

engine:
  kind: diffusers
  precision: fp16
  diffusers:
    image: "runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04"
    server_cmd: ["python", "-m", "kinoforge.engines.diffusers.servers.wan_t2v_server"]
    pip:
      - "torch==2.6.0"
      - "torchvision==0.21.0"
      - "torchaudio==2.6.0"
      - "diffusers>=0.32"
      - "transformers>=4.45"
      - "accelerate>=1.0"
      - "peft>=0.13"
      - "fastapi>=0.115"
      - "uvicorn>=0.30"
      - "imageio[ffmpeg]>=2.34"
    base_url: "http://localhost:8000"
    prompt_body_key: "prompt"
    # Needs-only embed (U53). A whole-package embed of
    # kinoforge.engines.diffusers.servers also shipped minimax_h3_server.py,
    # _lora.py and _av_io.py — ~39.7 KB of env payload for modules only the
    # Modal-only H3 server imports, which pushed 8 of 13 RunPod diffusers
    # configs past the ~101 KB create-mutation ceiling. Enforced by
    # tests/providers/test_pod_embed_closure.py; see
    # docs/superpowers/specs/2026-09-23-u53-needs-only-embed-design.md.
    embed_files:
      - "kinoforge.engines.diffusers.servers.wan_t2v_server"
      - "kinoforge.engines.diffusers.servers._util_stats"
      - "kinoforge.engines.diffusers.servers._video_io"

models:
  - ref: "hf:Wan-AI/Wan2.1-T2V-1.3B-Diffusers"
    kind: base
    target: checkpoints

compute:
  provider: runpod
  image: "runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04"
  mode: pod
  warm_reuse_auto_attach: true
  # Dedicated hosts. RunPod's community pool reclaims pods minutes after
  # create, and this cfg was hit TWICE on 2026-09-12 (pods i5mvj3oxljkyaa and
  # ag0ntjnovabxqt, both killed ~2-3 min into a boot that needs ~6): the
  # terminate call then failed with POD_NOT_FOUND because the host had already
  # removed it. Every sibling cfg with a boot longer than a couple of minutes
  # already pins this — the swap-group base was the one that did not, which is
  # why a shared warm pod serving three cells was the thing left exposed to it.
  backend_options:
    runpod:
      cloud_type: secure
  placement:
    min_vram_gb: 24
    min_cuda: "12.4"
    # Raised 0.40 -> 0.60 by operator decision 2026-09-12, on this cap's own
    # merits. At $0.40 this config was UNPLACEABLE: the pre-book filter read an
    # advertised 4090 at $0.34, the pod billed more, and S4's realized-rate
    # check destroyed every pod with `RateCapExceeded` before cell 0 could run.
    # A cap no current offer can satisfy is not a guard, it is an outage.
    #
    # U36 is now FIXED (2026-09-14, `cd133238`) and the numbers above have a
    # different explanation than the one first written here. The gap was never
    # RunPod pricing variance: `find_offers` was reading the COMMUNITY price
    # while this cfg books `cloud_type: secure`, and realized equals
    # advertised-for-the-pool EXACTLY on every arm measured. What this cap now
    # filters on is the secure price the pod will actually bill — so $0.60
    # currently admits the A5000 ($0.270), L4 ($0.490), A40 ($0.490) and 3090
    # ($0.500), and correctly refuses the secure 4090 ($0.740) BEFORE booking it
    # rather than after.
    #
    # Still not licence to raise other shipped caps: the right fix for an
    # unplaceable cfg is to check what its pool really charges, which is now
    # what `kinoforge offers` shows you.
    max_usd_per_hr: 0.60
    accelerators:
      - "NVIDIA RTX A5000"
      - "NVIDIA GeForce RTX 4090"
      - "NVIDIA L4"
    disk_gb: 40
  lifecycle:
    idle_timeout: 10m
    job_timeout: 5m
    time_buffer: 2m
    max_lifetime: 60m
    boot_timeout: 30m
    budget: 0.50
    heartbeat_interval_s: 30
    lora_swap_re_probe_after_s: 300

spec:
  model: "Wan2.1-T2V-1.3B-Diffusers"
  pipeline: "WanPipeline"
  scheduler: "UniPCMultistepScheduler"
  width: 480
  height: 480
  num_frames: 33
  fps: 16

loras:
  - ref: "civitai:1479320@1673265"   # wan2.1 1.3b static rotation
    strength: 1.0
  - ref: "civitai:1595383@1805395"   # Pokemon Sprite Animation Video LoRA
    strength: 1.0
