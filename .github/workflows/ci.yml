name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          # windows-latest declined — see windows-migration-cancelled.md
    env:
      # Claude Code (and its ~/.claude/hooks/redact_secrets.py dotfile) is
      # not installed on these runners — it's a Claude Code dotfile, not
      # part of the checkout. This opts test_redact_hook_parity.py out of
      # ONLY the user-scope hook *presence* check; it does not touch the
      # in-repo hook parity test, the pre-commit scan-secrets hook, or the
      # tracked-tree guard in test_source_audit.py, all of which still run.
      KINOFORGE_SKIP_USER_REDACT_HOOK: "1"

    steps:
      - uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: latest
          cache: true

      - name: Verify pixi installation
        run: pixi --version

      - name: Lint
        run: pixi run lint

      - name: Type check
        run: pixi run typecheck

      - name: Test
        run: pixi run test

      - name: LoRA smoke pyramid Tier 1 (smoke-local)
        run: pixi run smoke-local
